<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Samridhi's LegalDesk</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
        }

        #logoutButton {
            padding: 9px 16px;
            border: none;
            border-radius: 6px;
            background: white;
            color: #222;
            cursor: pointer;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .welcome h2 {
            margin-bottom: 10px;
        }

        .welcome p {
            color: #666;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        #status {
            color: #777;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #newBlogButton {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        #newBlogButton:hover {
            background: #444;
        }

        .blog-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .blog-card h3 {
            margin-bottom: 8px;
        }

        .blog-category {
            font-size: 13px;
            color: #777;
            margin-bottom: 8px;
        }

        .blog-excerpt {
            color: #555;
        }

        .blog-status {
            padding: 6px 10px;
            border-radius: 5px;
            background: #eee;
            font-size: 13px;
            white-space: nowrap;
        }
        .blog-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .edit-button {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .edit-button:hover {
            background: #444;
        }
        .delete-button {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            background: #eee;
            color: #222;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

    <header>
        <h1>Samridhi's LegalDesk — Admin</h1>

        <button id="logoutButton">
            Logout
        </button>
    </header>

    <main>

        <section class="welcome">
            <h2 id="welcomeMessage">Checking authentication...</h2>
            <p id="adminEmail"></p>
        </section>

        <section class="section">
            <div class="section-header">
                <h2>Blogs</h2>
                <button id="newBlogButton">+ New Blog</button>
            </div>

            <div id="blogList">
                <p id="status">Loading blogs...</p>
            </div>
        </section>

    </main>

    <script>

        async function checkAuthentication() {

            try {

                const response = await fetch(
                    "https://legaldesk-backend.vercel.app/api/auth/me",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );

                if (!response.ok) {
                    window.location.href = "login.html";
                    return;
                }

                const data = await response.json();

                document.getElementById("welcomeMessage").textContent =
                    `Welcome, ${data.admin.name}`;

                document.getElementById("adminEmail").textContent =
                    data.admin.email;

            } catch (error) {

                console.error("Authentication check failed:", error);

                window.location.href = "login.html";
            }
        }
        async function loadBlogs() {

        const blogList = document.getElementById("blogList");

        try {

            const response = await fetch(
                "https://legaldesk-backend.vercel.app/api/admin/blogs",
                {
                    method: "GET",
                    credentials: "include"
                }
            );

            if (!response.ok) {
                throw new Error("Failed to load blogs.");
            }

            const blogs = await response.json();

            if (blogs.length === 0) {
                blogList.innerHTML = "<p>No blogs found.</p>";
                return;
            }

            blogList.innerHTML = "";

            blogs.forEach(blog => {

            const blogCard = document.createElement("div");

            blogCard.className = "blog-card";

            blogCard.innerHTML = `
            <div>
                <h3>${blog.title}</h3>

                <p class="blog-category">
                    ${blog.category || "Uncategorized"}
                </p>

                <p class="blog-excerpt">
                    ${blog.excerpt || "No excerpt available."}
                </p>
            </div>

            <div class="blog-actions">

            <span class="blog-status">
                ${blog.published ? "Published" : "Draft"}
            </span>

            <button onclick="editBlog(${blog.id})">Edit</button>

            <button onclick="togglePublish(${blog.id}, ${blog.published})">
                ${blog.published ? "Unpublish" : "Publish"}
            </button>

            <button onclick="deleteBlog(${blog.id}, '${blog.title.replace(/'/g, "\\'")}')">Delete</button>

            </div>
        `;

            blogList.appendChild(blogCard);
        });

        } catch (error) {

            console.error("Failed to load blogs:", error);

            blogList.innerHTML = `
                <p>Unable to load blogs.</p>
            `;
        }
    }
        async function deleteBlog(blogId, blogTitle) {

        const confirmed = confirm(
            `Are you sure you want to delete this blog ?`
        );

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetch(
                `https://legaldesk-backend.vercel.app/api/blogs/${blogId}`,
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message || "Failed to delete blog."
                );
            }

            alert("Blog deleted successfully.");

            loadBlogs();

        } catch (error) {

            console.error("Delete blog error:", error);

            alert(error.message);
        }
    }
        async function togglePublish(id, currentStatus) {
    const action = currentStatus ? "unpublish" : "publish";

    const confirmed = confirm(
        `Are you sure you want to ${action} this blog?`
    );

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch(
            `https://legaldesk-backend.vercel.app/api/blogs/${id}/publish`,
            {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    published: !currentStatus
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Failed to update publication status.");
        }

        alert(data.message);

        loadBlogs();

    } catch (error) {
        console.error("Publish status error:", error);
        alert(error.message);
    }
}
        document.getElementById("logoutButton")
    .addEventListener("click", async () => {

        try {
            const response = await fetch(
                "https://legaldesk-backend.vercel.app/api/auth/logout",
                {
                    method: "POST",
                    credentials: "include"
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message || "Logout failed."
                );
            }

            window.location.href = "login.html";

        } catch (error) {
            console.error("Logout error:", error);
            alert(error.message);
        }

    });
        document.getElementById("newBlogButton")
        .addEventListener("click", () => {
            window.location.href = "new-blog.html";
        });


        checkAuthentication();
        loadBlogs();
        function editBlog(blogId) {
            window.location.href = `new-blog.html?id=${blogId}`;
        }
    </script>

</body>
</html>
