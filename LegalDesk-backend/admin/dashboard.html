<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Samridhi's LegalDesk</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
        }

        #logoutButton {
            padding: 9px 16px;
            border: none;
            border-radius: 6px;
            background: white;
            color: #222;
            cursor: pointer;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .welcome h2 {
            margin-bottom: 10px;
        }

        .welcome p {
            color: #666;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        #status {
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>Samridhi's LegalDesk — Admin</h1>

        <button id="logoutButton">
            Logout
        </button>
    </header>

    <main>

        <section class="welcome">
            <h2 id="welcomeMessage">Checking authentication...</h2>
            <p id="adminEmail"></p>
        </section>

        <section class="section">
            <h2>Blogs</h2>

            <p id="status">
                Blog management will be added next.
            </p>
        </section>

    </main>

    <script>

        async function checkAuthentication() {

            try {

                const response = await fetch(
                    "http://localhost:5000/api/auth/me",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );

                if (!response.ok) {
                    window.location.href = "login.html";
                    return;
                }

                const data = await response.json();

                document.getElementById("welcomeMessage").textContent =
                    `Welcome, ${data.admin.name}`;

                document.getElementById("adminEmail").textContent =
                    data.admin.email;

            } catch (error) {

                console.error("Authentication check failed:", error);

                window.location.href = "login.html";
            }
        }


        document.getElementById("logoutButton")
            .addEventListener("click", () => {

                // Logout endpoint will be added next.
                alert("Logout will be implemented next.");

            });


        checkAuthentication();

    </script>

</body>
</html>
